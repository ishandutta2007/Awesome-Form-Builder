<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    .orb-anim {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .card-1 {
      animation: floatCard1 5s ease-in-out infinite;
    }
    .card-2 {
      animation: floatCard2 6s ease-in-out infinite;
    }
    .flow-dash {
      stroke-dasharray: 8 6;
      animation: flowLine 15s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Glowing Ambience in background -->
  <circle cx="180" cy="80" r="140" fill="#38bdf8" opacity="0.15" filter="url(#glow)" class="orb-anim" />
  <circle cx="1020" cy="240" r="160" fill="#818cf8" opacity="0.18" filter="url(#glow)" class="orb-anim" style="animation-delay: -3s;" />

  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="800" y1="0" x2="800" y2="340" />
    <line x1="1000" y1="0" x2="1000" y2="340" />
  </g>

  <!-- Dynamic connecting workflow lines -->
  <path d="M 850 80 C 920 80, 950 140, 1000 140 S 1080 200, 1120 200" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.35" class="flow-dash" />
  <path d="M 80 280 C 180 280, 220 210, 320 210" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.25" class="flow-dash" />

  <!-- Animated Floating Decorative Card 1 (Right Side Form Preview) -->
  <g class="card-1">
    <rect x="880" y="45" width="260" height="150" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    <!-- Form Card Inner Elements -->
    <rect x="900" y="65" width="90" height="10" rx="5" fill="#38bdf8" opacity="0.8" />
    <rect x="900" y="85" width="220" height="24" rx="6" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <circle cx="915" cy="97" r="4" fill="#38bdf8" opacity="0.7" />
    <rect x="930" y="94" width="70" height="6" rx="3" fill="#ffffff" opacity="0.4" />
    
    <rect x="900" y="120" width="110" height="10" rx="5" fill="#818cf8" opacity="0.8" />
    <rect x="900" y="140" width="220" height="24" rx="6" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <rect x="915" y="149" width="100" height="6" rx="3" fill="#ffffff" opacity="0.4" />
    <rect x="1050" y="145" width="60" height="14" rx="4" fill="#6366f1" opacity="0.8" />
  </g>

  <!-- Animated Floating Decorative Card 2 (Survey & Logic Pill) -->
  <g class="card-2">
    <rect x="940" y="215" width="210" height="85" rx="10" fill="url(#card-grad)" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="965" cy="240" r="10" fill="#10b981" opacity="0.2" />
    <circle cx="965" cy="240" r="5" fill="#10b981" />
    <text x="985" y="244" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Conditional Logic Active</text>
    <rect x="960" y="265" width="170" height="16" rx="4" fill="#ffffff" fill-opacity="0.06" />
    <rect x="965" y="270" width="110" height="6" rx="3" fill="#c084fc" opacity="0.7" />
  </g>

  <!-- Foreground Main Branding Content (High Z-Order & High Contrast) -->
  <g>
    <!-- Top Pill Badge -->
    <rect x="70" y="55" width="230" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="90" cy="71" r="5" fill="#38bdf8" />
    <text x="105" y="76" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">THE FORM ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="70" y="145" fill="url(#accent-cyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      Awesome Form Builder
    </text>

    <!-- Subtitle -->
    <text x="70" y="195" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">
      Curated SaaS Platforms, Survey Engines &amp; Open-Source Frameworks
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(70, 240)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="36" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
      <text x="16" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">⚡ Drag &amp; Drop Builders</text>

      <!-- Pill 2 -->
      <rect x="180" y="0" width="170" height="36" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
      <text x="196" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">🔀 Conditional Logic</text>

      <!-- Pill 3 -->
      <rect x="365" y="0" width="180" height="36" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
      <text x="381" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">🛠️ Self-Hosted &amp; FOSS</text>
    </g>
  </g>
</svg>
